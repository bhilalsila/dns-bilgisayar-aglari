<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilal Sıla Balcıoğlu - Bilgisayar Ağları Laboratuvarı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f766e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f8fafc;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }
        .tag {
            display: inline-block;
            background: #0d9488;
            color: #ffffff;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 30px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .desc {
            font-size: 14.5px;
            line-height: 1.7;
            color: #cbd5e1;
            background: rgba(15, 23, 42, 0.5);
            padding: 18px;
            border-radius: 10px;
            border-left: 3px solid #14b8a6;
            text-align: left;
        }
        .dns-chips {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }
        .chip {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-family: monospace;
            color: #5eead4;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="tag">Bilgisayar Ağları Dersi</span>
        <h1>Hilal Sıla Balcıoğlu</h1>
        <div class="subtitle">Uygulamalı DNS ve Web Hosting Çalışması</div>
        
        <div class="desc">
            Bu platform, İnternet Protokol kümesindeki Alan Adı Sistemi (DNS) mimarisini incelemek, ad çözümleme süreçlerini gözlemlemek ve temel kaynak kayıtlarını doğrulamak üzere yapılandırılmıştır.
        </div>

        <div class="dns-chips">
            <span class="chip">A</span>
            <span class="chip">CNAME</span>
            <span class="chip">MX</span>
            <span class="chip">NS</span>
        </div>
    </div>
</body>
</html>
