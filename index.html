<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilgisayar Ağları Dersi - DNS Çalışması</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #162635, #0a3143, #0b3d45);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .badge {
            background-color: #17a28b;
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 25px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 1.8em;
            font-weight: 600;
        }
        .subtitle {
            color: #8b9cad;
            font-size: 0.95em;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        .content-box {
            background-color: #1c2b36;
            border-left: 4px solid #17a28b;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            font-size: 0.95em;
            line-height: 1.6;
            color: #cdd6de;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .btn {
            background-color: rgba(23, 162, 139, 0.2);
            color: #17a28b;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #17a28b;
            color: white;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">BİLGİSAYAR AĞLARI DERSİ</div>
        <h1>Hilal Sıla Balcıoğlu</h1>
        <div class="subtitle">Uygulamalı DNS ve Web Hosting<br>Çalışması</div>

        <div class="content-box">
            Bu platform, İnternet Protokol kümesindeki Alan Adı Sistemi (DNS) mimarisini incelemek, ad çözümleme süreçlerini gözlemlemek ve temel kaynak kayıtlarını doğrulamak üzere yapılandırılmıştır.
        </div>

        <div class="button-group">
            <button class="btn">A</button>
            <button class="btn">CNAME</button>
            <button class="btn">MX</button>
            <button class="btn">NS</button>
        </div>
    </div>

</body>
</html>
